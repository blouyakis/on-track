name: AI review

# Claude reviews a pull request and posts its findings as PR comments.
# - Runs automatically when a non-draft PR is opened, reopened, or marked
#   ready for review. Pushes to an open PR do not start a new review.
# - Runs again when a repo owner, member, or collaborator posts a PR comment
#   that starts with "@claude review". Comment events always use the
#   workflow file on the default branch, so this trigger works after merge.
# - PRs from forks are not reviewed (the action skips them).
# - The Anthropic API key comes only from the ANTHROPIC_API_KEY secret.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@claude review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # Job-level, not workflow-level: the job's `if` is checked first, so a
    # comment that is not "@claude review" never cancels a running review.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # Review dimensions: Google Engineering Practices, "What to look for in
          # a code review" (google.github.io/eng-practices/review/reviewer/looking-for.html).
          # Comment labels: Conventional Comments (conventionalcomments.org).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are reviewing a pull request for OnTrack. Read CLAUDE.md and
            docs/PRD.md first. The checked-out tree may be the base branch, so
            get the changes with `gh pr diff` and the description with
            `gh pr view`. Review only what this PR changes.
            Before reviewing, read earlier review comments with
            `gh pr view --comments`. Do not repeat a finding that is already
            posted and still applies.
            If the PR changes CLAUDE.md or docs/PRD.md, review against the
            current versions and add a `question (non-blocking)` comment that
            flags the rule change for human review.

            ## Review dimensions (Google Engineering Practices)
            Check the change for each of these:
            - Design: the change makes sense as a whole, belongs here, and
              fits the rest of the system.
            - Functionality: it does what the author intends; look for edge
              cases, race conditions, and bugs visible from reading the code.
            - Complexity: no line, function, or component is harder to follow
              than it needs to be; no over-engineering or features not needed now.
            - Tests: the right unit, integration, or end-to-end tests exist,
              are correct, and would fail if the code broke.
            - Naming: names are clear and descriptive without being long.
            - Comments: comments are clear and needed, and explain why rather
              than what; stale comments and TODOs are cleaned up.
            - Style: the code follows the project's conventions (CLAUDE.md,
              ESLint, Prettier); personal preferences are only nitpicks.
            - Documentation: README, CLAUDE.md, or other docs are updated when
              the change alters how to build, test, run, or use the project.

            ## CLAUDE.md checklist
            Check the change against these project rules and flag each break:
            - Business rules in src/lib/ are pure functions with no React,
              Next.js, or Supabase imports, and they return result values
              for expected failures instead of throwing.
            - src/lib/ code has tests written first (a `test:` commit before
              the `feat:` commit), and no test was changed or deleted just to
              make it pass.
            - Roles are per project (`contributor`, `overseer`) and never
              stored on the user. Role and project IDs from the client are
              not trusted; membership is looked up on the server.
            - Access is enforced in server code and in Row Level Security.
              No data, including a project's name, reaches a user without a
              membership in that project.
            - Input is validated on the server with the src/lib/ functions,
              following the PRD's "Rules the logic must enforce".
            - Entry types and role names match the PRD exactly.
            - TypeScript strict: no `any`. Named exports in src/lib/.
              Kebab-case file names, PascalCase components. Server
              Components unless state, effects, or browser APIs need
              "use client".
            - Nothing from the PRD's out-of-scope list (task lists, timers,
              notifications, GitHub import, file uploads).
            - No secrets, .env files, or keys in the diff. No hand edits to
              AGENTS.md, package-lock.json, or node_modules/.
            - Commits use Conventional Commit prefixes, and the PR
              description states the AI disclosure (percent AI-generated,
              tool used, human review applied).

            ## How to post
            - Label every comment with Conventional Comments: start it with
              `<label> (<blocking|non-blocking>): <subject>`, using one of
              `issue`, `suggestion`, `nitpick`, `question`, or `praise`.
              Examples: `issue (blocking): ...`, `nitpick (non-blocking): ...`.
              `nitpick` and `praise` are always non-blocking. Mark a comment
              blocking only if it must be fixed before merge.
            - Use the inline comment tool for findings tied to specific lines.
              Each one says what is wrong, why it matters, and a fix.
            - Then post one summary comment with `gh pr comment` that groups
              the findings by the review dimensions above and the CLAUDE.md
              checklist, blocking findings first. Keep each finding's label.
              If earlier review comments exist, list which of their findings
              this PR has now fixed.
            - Report only real problems you can point to in the diff, plus
              at most one `praise` when something is done well. If you find
              no problems, say so plainly. Do not push commits or change files.
